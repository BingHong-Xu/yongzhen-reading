<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>

  <title>書香「永」恆，「貞」惜閱讀－永貞國小圖書館閱讀推動成果網站 (Google Sites 嵌入專用版)</title>

  <!-- Google Fonts: Noto Serif TC & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ==========================================================================
       Google Sites Embed Design System (Pure CSS, Mobile-First, RWD)
       ========================================================================== */
    :root {
      --primary: #1b4931;
      --primary-light: #286343;
      --primary-dark: #123322;
      --primary-tint: rgba(27, 73, 49, 0.08);
      --secondary: #c87d32;
      --secondary-light: #e0974f;
      --secondary-tint: rgba(200, 125, 50, 0.1);
      --accent: #d97706;
      --bg-body: #f8faf9;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f3;
      --border-color: #e2e8e5;
      --text-main: #19231f;
      --text-secondary: #4a5c54;
      --text-muted: #73877e;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 12px 32px rgba(27, 73, 49, 0.12);
      --font-main: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-title: 'Noto Serif TC', Georgia, serif;
    }

    [data-theme="dark"] {
      --bg-body: #0d1411;
      --bg-card: #15201b;
      --bg-subtle: #1c2b25;
      --border-color: #2a3d35;
      --text-main: #f0fdf4;
      --text-secondary: #9cb5a8;
      --text-muted: #6b8277;
      --primary: #34d399;
      --primary-light: #6ee7b7;
      --primary-dark: #10b981;
      --primary-tint: rgba(52, 211, 153, 0.12);
      --secondary: #fbbf24;
      --secondary-light: #fcd34d;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      font-size: 15px;
      padding: 12px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Container */
    .embed-container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Header Banner */
    .embed-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary) 70%, var(--secondary-light));
      color: #ffffff;
      padding: clamp(1.2rem, 3vw, 2rem) clamp(1rem, 2.5vw, 1.8rem);
      border-radius: var(--radius-lg);
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .embed-header::after {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
      border-radius: 50%;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.08);
    }

    .header-title {
      font-family: var(--font-title);
      font-size: clamp(1.35rem, 3.5vw, 1.9rem);
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .header-title span {
      color: #fed7aa;
    }

    .header-subtitle {
      font-size: clamp(0.85rem, 1.8vw, 0.95rem);
      opacity: 0.92;
      line-height: 1.5;
    }

    /* Stats Quick Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 1.2rem;
    }

    .stat-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s;
    }

    .stat-pill:hover {
      transform: translateY(-2px);
    }

    .stat-num {
      font-size: clamp(1.1rem, 2.8vw, 1.45rem);
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
      font-family: var(--font-title);
    }

    .stat-lbl {
      font-size: clamp(0.72rem, 1.6vw, 0.8rem);
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 3px;
    }

    /* Sticky Navigation & Toolbar */
    .sticky-toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-body);
      padding: 8px 0 10px;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
    }

    /* Category Swipe Scroll */
    .category-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      white-space: nowrap;
      padding: 7px 14px;
      min-height: 38px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .cat-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--bg-subtle);
    }

    .cat-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(27, 73, 49, 0.3);
    }

    .cat-count {
      background: rgba(0, 0, 0, 0.08);
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: var(--radius-pill);
    }

    .cat-btn.active .cat-count {
      background: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }

    /* Media Type Filter Chips */
    .media-chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 0 8px;
      scrollbar-width: none;
    }

    .media-chips-row::-webkit-scrollbar {
      display: none;
    }

    .media-chip {
      padding: 5px 12px;
      min-height: 32px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .media-chip.active {
      background: var(--text-main);
      color: var(--bg-body);
      border-color: var(--text-main);
    }

    /* Search & Filter Controls */
    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 9px 36px 9px 34px;
      min-height: 40px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-tint);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      display: none;
    }

    .sort-dropdown {
      padding: 8px 12px;
      min-height: 40px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.84rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Result Status */
    .results-info {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 600;
      margin: 10px 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Cards Grid (Super Responsive) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 2rem;
    }

    @media (max-width: 640px) {
      .cards-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card:hover, .card:active {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }

    .card-thumb {
      position: relative;
      height: 180px;
      background: var(--bg-subtle);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }

    .card:hover .card-thumb img {
      transform: scale(1.05);
    }

    .card-thumb-hero {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      gap: 6px;
      text-align: center;
      padding: 10px;
    }

    .card-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(27, 73, 49, 0.92);
      backdrop-filter: blur(6px);
      color: #ffffff;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .card-type-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .card-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-sec {
      font-size: 0.76rem;
      color: var(--secondary);
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .card-desc {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 12px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .card-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-action {
      color: var(--primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 1.5rem 0 3rem;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .page-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .page-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Modal Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      position: relative;
      display: flex;
      flex-direction: column;
      animation: modalZoom 0.25s ease-out;
    }

    @keyframes modalZoom {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      z-index: 10;
      transition: transform 0.2s;
    }

    .modal-close:hover {
      transform: scale(1.1);
    }

    .modal-media-wrap {
      width: 100%;
      background: #000000;
      max-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .modal-media-wrap img, .modal-media-wrap video, .modal-media-wrap iframe {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .modal-content {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.75;
      margin-bottom: 1.5rem;
    }

    .modal-content p {
      margin-bottom: 0.75rem;
    }

    .modal-btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--border-color);
    }

    /* Back To Top Floating Button */
    .fab-top {
      position: fixed;
      bottom: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      z-index: 90;
      transition: transform 0.2s;
    }

    .fab-top.visible {
      display: flex;
    }

    .fab-top:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="embed-container">

    <!-- Header Banner -->
    <header class="embed-header">
      <div class="header-top-row">
        <span class="header-badge"><i class="fa-solid fa-school"></i> 苗栗縣頭份市永貞國民小學</span>
        <button class="theme-toggle-btn" id="themeBtn" title="切換深淺色模式" aria-label="切換主題">
          <i class="fa-solid fa-sun"></i>
        </button>
      </div>
      <h1 class="header-title">書香<span>「永」</span>恆，<span>「貞」</span>惜閱讀</h1>
      <p class="header-subtitle">圖書館閱讀推動成果展示網 ｜ 閱讀推動教師 徐秉鴻老師 (STEM Teacher Bing)</p>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-pill">
        <div class="stat-num" id="stSec">78</div>
        <div class="stat-lbl">特色專欄</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" id="stWish">686</div>
        <div class="stat-lbl">成果篇章</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" id="stMed">538+</div>
        <div class="stat-lbl">本機多媒體</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" id="stExt">400+</div>
        <div class="stat-lbl">教材外鏈</div>
      </div>
    </div>

    <!-- Sticky Toolbar -->
    <div class="sticky-toolbar">
      <!-- 8 Categories Horizontal Swipe -->
      <div class="category-scroll" id="catTabs">
        <!-- Dynamically rendered -->
      </div>

      <!-- Media Type Quick Chips -->
      <div class="media-chips-row" id="mediaChips">
        <button class="media-chip active" data-type="all"><i class="fa-solid fa-border-all"></i> 全部媒體</button>
        <button class="media-chip" data-type="year114" style="font-weight:800; background:rgba(217,119,6,0.15); color:#d97706; border-color:rgba(217,119,6,0.4);"><i class="fa-solid fa-star"></i> 🌟 114學年度專區</button>
        <button class="media-chip" data-type="image"><i class="fa-solid fa-camera"></i> 成果照片</button>
        <button class="media-chip" data-type="video"><i class="fa-solid fa-play"></i> 影音短片</button>
        <button class="media-chip" data-type="audio"><i class="fa-solid fa-headphones"></i> 說書與廣播</button>
        <button class="media-chip" data-type="canva"><i class="fa-solid fa-palette"></i> Canva教材</button>
        <button class="media-chip" data-type="pdf"><i class="fa-solid fa-file-pdf"></i> PDF文件</button>
        <button class="media-chip" data-type="form"><i class="fa-solid fa-clipboard-question"></i> 學習單問卷</button>
      </div>

      <!-- Search & Sort Controls -->

感恩節慶xSEL情緒學習","body_html":"<p>全年度完整規劃「書香永恆・貞惜閱讀」四大主題書展活動，包含「經典萬世師表孔子」、「感恩節慶×SEL」、「環境閱讀×世界關懷」及「生命教育×畢業成果展」。</p>","snippet":"永貞國小 114學年度圖書館主題閱讀活動全彩海報，統整四大主題書展（至聖先師、感恩節慶、環境關懷、生命教育）推動重點。","local_media":"assets/media/114_reading_poster.png","media_type":"image","attachment_url":"","link_type":"none","youtube_id":"","created_at":"2026-01-03T03:11:33.523Z"},{"id":"3736698944","title":"課程與教學活動編撰","section_id":"343042186","section_title":"114-1閱讀推動內容","category_id":"blueprint","category_name":"閱讀推動藍圖與理念","body_text":"獲獎教案\n 徐秉鴻(2025)。閱讀與思辨：「永」遠堅「貞」，堅守拒毒。教案發表於苗栗縣114年度毒品危害防制融入課程教案比賽。中華民國臺灣。【特優】\n 徐秉鴻(2025)。我，是誰？我們，是誰？。教案發表於苗栗縣114學年度生命教育課程教案徵選。中華民國臺灣。【優等】\n 徐秉鴻(2025)。快樂的祕密配方──從閱讀中認識情緒、學會感恩與助人。教案發表於苗栗縣114學年度生命教育課程教案徵選。中華民國臺灣。【優等】\n\n 未獲獎教案\n 徐秉鴻(2025)。魚鄉行動隊 I - 海風裡的「永」續密碼。\n 徐秉鴻(2025)。魚鄉行動隊 II - 魚卡故事與「貞」心承諾。","body_html":"<p>苗栗縣頭份市永貞國小榮獲全縣 114 學年度跨領域素養導向課程教案競賽首獎，將閱讀素養、在地文史、美感教育與科技載具完美融合。</p>","snippet":"榮獲苗栗縣 114 學年度【跨領域素養導向課程教案】第一名（首獎），展現全校深耕閱讀與跨域探索卓越品質。","local_media":"assets/media/114_curriculum_first_prize.png","media_type":"image","attachment_url":"","link_type":"none","youtube_id":"","created_at":"2026-01-03T03:09:58.663Z"},{"id":"3736279974","title":"書香「永」恆，「貞」惜閱讀","section_id":"329013820","section_title":"英語明日閱讀MSSR","category_id":"mssr_morning","category_name":"晨讀與英語 MSSR","body_text":"","body_html":"","snippet":"📷 點擊查看詳細成果照片、學生作品展示與活動圖文紀錄。","local_media":"assets/media/wish_3736279974.png","media_type":"image","attachment_url":"https://u1.padletusercontent.com/uploads/padlet-uploads-usc1/2633604001/ba8dbf0986ba0beb800b5525542e8406/qr_code__1_.png?expiry_token=5WaHZRdGG3LkUVQGy3SZ-zdRtq89aJeottSBaF_Hii8dmxJqYDvE2-MDbblcM-ZrVekXW99RReKkJFIoMoKio2bPgpfz1zCOv5GmYa26UsWwmZ174dGj8iOiBMc1JVRhnIBeFVcsHNWT9Q_SPGiAjKzlqFdwWQsZgIr7qwO7d0ijd4hO-4ExIGrd2UOCjK9IrfRSajZXSFsxojRI40zM3SofmyMbxLOyXMoT0Tu0Les=","link_type":"web","youtube_id":"","created_at":"2026-01-02T02:52:44.619Z"},{"id":"3736279045","title":"4","section_id":"342750936","section_title":"20260102英文MSSR","category_id":"m morning","category_name":"晨讀與英語 MSSR","body_text":"意大利語課程問候語：如何說你好、再見以及其間的一切 \n By 意大利學院工作室 / 2023 年 7 月 30 日\n 再見！ 如果您有興趣學習一些意大利語問候語，那麼您來對地方了。 意大利語是一種極其美麗和浪漫的語言，有著迷人的文化。 開始意大利語之旅的最佳方法之一就是學習基礎知識。 因此，在這篇文章中，我們將分享一些基本的意大利語課程問候語，並教您如何說你好、再見以及其間的一切。\n 你好/嗨 – Ciao/Buongiorno\n 最基本的意大利語問候語是“ciao”，意思是你好/嗨。 這是一種隨意的問候語，常用於朋友、家人或同事之間。 “早上好”的對應詞是“buongiorno”，字面意思是“美好的一天”。 這是一種更正式的問候語，適合在正式場合或中午之前與陌生人使用。\n 晚上好 – 布納塞拉\n 到了晚上，您可能想使用意大利語問候語“晚安”——“buonasera”。 這可以從下午 6 點左右到午夜使用，是晚上見到某人時的禮貌問候。\n 你好嗎？ – 來吧？\n 如果你想問某人怎麼樣，你可以說“come stai?” 翻譯過來就是“你好嗎？” 這是一種非正式的問候語，用於朋友和熟人之間。\n 很高興認識你 – Piacere di conoscerti\n 當你剛剛被介紹給某人時，禮貌地說“很高興認識你”。 在意大利語中，如果您與年長的人或地位較高的人交談，您會說“piacere di conoscerti”或“piacere di conoscerla”。\n 再見——到達/Ciao\n 要用意大利語說再見，可以使用“arrivederci”，這是一種正式而禮貌的告別。 這可以在任何情況下使用，並且適合在商業、社交或正式場合使用。 如果您與朋友和家人在一起，也可以使用“ciao”來告別。\n 這些是您需要了解的一些最常見和最重要的意大利問候語。 無論您是去意大利旅行、想與意大利朋友聯繫，還是只是想學習一門新語言，了解這些問候語都會對您有很大幫助。 練習它們並嘗試在對話中使用它們，您很快就會成為一名流利的意大利語使用者。 祝你好運！ （祝你好運！）","body_html":"<p>意大利語課程問候語：如何說你好、再見以及其間的一切</p><p>By 意大利學院工作室 / 2023 年 7 月 30 日</p><p>再見！ 如果您有興趣學習一些意大利語問候語，那麼您來對地方了。 意大利語是一種極其美麗和浪漫的語言，有著迷人的文化。 開始意大利語之旅的最佳方法之一就是學習基礎知識。 因此，在這篇文章中，我們將分享一些基本的意大利語課程問候語，並教您如何說你好、再見以及其間的一切。</p><p>你好/嗨 – Ciao/Buongiorno</p><p>最基本的意大利語問候語是“ciao”，意思是你好/嗨。 這是一種隨意的問候語，常用於朋友、家人或同事之間。 “早上好”的對應詞是“buongiorno”，字面意思是“美好的一天”。 這是一種更正式的問候語，適合在正式場合或中午之前與陌生人使用。</p><p>晚上好 – 布納塞拉</p><p>到了晚上，您可能想使用意大利語問候語“晚安”——“buonasera”。 這可以從下午 6 點左右到午夜使用，是晚上見到某人時的禮貌問候。</p><p>你好嗎？ – 來吧？</p><p>如果你想問某人怎麼樣，你可以說“come stai?” 翻譯過來就是“你好嗎？” 這是一種非正式的問候語，用於朋友和熟人之間。</p><p>很高興認識你 – Piacere di conoscerti</p><p>當你剛剛被介紹給某人時，禮貌地說“很高興認識你”。 在意大利語中，如果您與年長的人或地位較高的人交談，您會說“piacere di conoscerti”或“piacere di conoscerla”。</p><p>再見——到達/Ciao</p><p>要用意大利語說再見，可以使用“arrivederci”，這是一種正式而禮貌的告別。 這可以在任何情況下使用，並且適合在商業、社交或正式場合使用。 如果您與朋友和家人在一起，也可以使用“ciao”來告別。</p><p>這些是您需要了解的一些最常見和最重要的意大利問候語。 無論您是去意大利旅行、想與意大利朋友聯繫，還是只是想學習一門新語言，了解這些問候語都會對您有很大幫助。 練習它們並嘗試在對話中使用它們，您很快就會成為一名流利的意大利語使用者。 祝你好運！ （祝你好運！）</p>","snippet":"意大利語課程問候語：如何說你好、再見以及其間的一切 \n By 意大利學院工作室 / 2023 年 7 月 30 日\n 再見！ 如果您有興趣學習一些意大利語問候語，那麼您來對地方了。 意大利語是一種極其美麗和浪漫的語言，有著迷人的文化。 開始意大利語之旅的最佳方法之一就是學習基礎知識。 因此，在這篇文...","local_media":"","media_type":"none","attachment_url":"https://accademiastudioitalia.com/zh-TW/author/accademia-studioitalia/","link_type":"web","youtube_id":"","created_at":"2025-12-30T13:21:46.410Z"},{"id":"3734788009","title":"安東尼的米蘭生活｜旅遊規劃師","section_id":"342750936","section_title":"20260102英文MSSR","category_id":"mssr_morning","category_name":"晨讀與英語 MSSR","body_text":"Ciao Ciao你一定要學的義語\n 出發義大利前，先記住這4個關鍵單字\n CIAO（發音：翹）\n 打招呼、說再見都能用！見面說Ciao，\n 離開也說Ciao～義大利人超愛用！\n\n https://www.facebook.com/share/r/1HWr5LQYUp/","body_html":"<p>Ciao Ciao你一定要學的義語</p><p>出發義大利前，先記住這4個關鍵單字</p><p>CIAO（發音：翹）</p><p>打招呼、說再見都能用！見面說Ciao，</p><p>離開也說Ciao～義大利人超愛用！</p><p><a href=\"https://www.facebook.com/share/r/1HWr5LQYUp/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"text-primary hover:underline font-semibold\"><i class=\"fa-solid fa-arrow-up-right-from-square\"></i> https://www.facebook.com/share/r/1HWr5LQYUp/</a></p>","snippet":"Ciao Ciao你一定要學的義語\n 出發義大利前，先記住這4個關鍵單字\n CIAO（發音：翹）\n 打招呼、說再見都能用！見面說Ciao，\n 離開也說Ciao～義大利人超愛用！","local_media":"assets/media/wish_3734788009.mp4","media_type":"video","attachment_url":"https://www.facebook.com/share/r/1HWr5LQYUp/","link_type":"web","youtube_id":"","created_at":"2025-12-30T13:20:21.942Z"},{"id":"3734634739","title":"20260102英文MSSR","section_id":"342750936","section_title":"20260102英文MSSR","category_id":"mssr_morning","category_name":"晨讀與英語 MSSR","body_text":"https://www.youtube.com/watch?v=noy8mpqTH3s","body_html":"<p><a href=\"https://www.youtube.com/watch?v=noy8mpqTH3s\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"text-primary hover:underline font-semibold\"><i class=\"fa-solid fa-arrow-up-right-from-square\"></i> https://www.youtube.com/watch?v=noy8mpqTH3s</a></p>","snippet":"🎬 點擊觀看學生說書分享與閱讀活動精華錄影。","local_media":"","media_type":"video","attachment_url":"https://www.youtube.com/watch?v=noy8mpqTH3s","link_type":"youtube","youtube_id":"noy8mpqTH3s", c1/2633604001/4eb9d24e8a282075eae6a8fab3990955/____________.mp4?expiry_token=5WaHZRdGG3LkUVQGy3SZ-zdRtq89aJeottSBaF_Hii8dmxJqYDvE2-MDbblcM-ZrVekXW99RReKkJFIoMoKio2bPgpfz1zCOv5GmYa26UsVK4l2iI5oJFSqMzXVEGZF7puEN7NW6xqb1QKqsVb0AtgarxmU9ckShAuXLU0otNow3gG0uniakE5Ufp3UZp0F6UyLLWTaYZljObVycSzH-G2EQiPtLaNkgUqIS13vIIaI=","link_type":"web","youtube_id":"","created_at":"2025-11-29T11:28:12.644Z"},{"id":"3703032093","title":"「永貞・蘆映書院」目標願景","section_id":"338490854","section_title":"圖書館改建意象2.0","category_id":"library_design","category_name":"圖書館改建意象","body_text":"1. 目標願景：古厝裡的現代杏壇，蘆葦間的永恆學堂 \n\n 本計畫以「永貞・蘆映書院」為核心願景，將 180 平方公尺的老舊圖書室，轉化為隱身於知識蘆葦叢中的「微型紅磚聚落」。透過空間轉譯，連結在地「蘆竹湳古厝」的歷史記憶與「永貞國小」的校本精神，打造一座兼具文化底蘊、數位科技與人文溫度的現代化閱讀基地。\n\n 2. 量化效益： \n\n 有效解決海量收納： 透過高效率的鋼構木皮書牆與流線型書架配置，有效達成 10,000 冊 藏書之收納目標，並保持動線寬敞流暢 。\n\n 提升閱讀借閱效能： 透過新書策展中島與舒適閱讀環境營造，預計提升學生入館意願， 每月圖書借閱人次預計成長 30% 以上 。\n\n 空間利用率最大化： 導入「左動右靜」分區與彈性家具（梯形桌、移動中島），讓圖書館從單純借還書場所，升級為多功能教學中心，預計 空間利用率提升至 100% 。\n\n 3. 質化效益： \n\n 文化傳承與在地認同： 透過「蘆葦意象入口」、「移動紅磚聚落」與「蘿蔔燈」等空間語彙，讓學生在潛移默化中認同在地蘆竹湳文化，體現「飲水思源、薪火相傳」的教育意涵 。\n\n 自主學習與協作探究： 打破傳統教室疆界，透過「琢玉工坊」的梯形積木桌與「杏壇稻埕」的數位展演舞台，支援 PBL 小組討論、雙語晨讀與說書人活動。引導學生從被動聽講轉向主動探究，落實十二年國教「自發、互動、共好」之核心素養 。\n\n 社區共融與親師共享： 打造「學校即社區閱讀資源中心」。透過窗邊 Bar 台與期刊區的設置，提供家長、志工與社區民眾優質的共讀場域，強化親師生共學文化，讓閱讀成為連結學校與社區的情感樞紐 。","body_html":"<p>1. 目標願景：古厝裡的現代杏壇，蘆葦間的永恆學堂</p><p>本計畫以「永貞・蘆映書院」為核心願景，將 180 平方公尺的老舊圖書室，轉化為隱身於知識蘆葦叢中的「微型紅磚聚落」。透過空間轉譯，連結在地「蘆竹湳古厝」的歷史記憶與「永貞國小」的校本精神，打造一座兼具文化底蘊、數位科技與人文溫度的現代化閱讀基地。</p><p>2. 量化效益：</p><p>有效解決海量收納： 透過高效率的鋼構木皮書牆與流線型書架配置，有效達成 10,000 冊 藏書之收納目標，並保持動線寬敞流暢 。</p><p>提升閱讀借閱效能： 透過新書策展中島與舒適閱讀環境營造，預計提升學生入館意願， 每月圖書借閱人次預計成長 30% 以上 。</p><p>空間利用率最大化： 導入「左動右靜」分區與彈性家具（梯形桌、移動中島），讓圖書館從單純借還書場所，升級為多功能教學中心，預計 空間利用率提升至 100% 。</p><p>3. 質化效益：</p><p>文化傳承與在地認同： 透過「蘆葦意象入口」、「移動紅磚聚落」與「蘿蔔燈」等空間語彙，讓學生在潛移默化中認同在地蘆竹湳文化，體現「飲水思源、薪火相傳」的教育意涵 。</p><p>自主學習與協作探究： 打破傳統教室疆界，透過「琢玉工坊」的梯形積木桌與「杏壇稻埕」的數位展演舞台，支援 PBL 小組討論、雙語晨讀與說書人活動。引導學生從被動聽講轉向主動探究，落實十二年國教「自發、互動、共好」之核心素養 。</p><p>社區共融與親師共享： 打造「學校即社區閱讀資源中心」。透過窗邊 Bar 台與期刊區的設置，提供家長、志工與社區民眾優質的共讀場域，強化親師生共學文化，讓閱讀成為連結學校與社區的情感樞紐 。</p>","snippet":"1. 目標願景：古厝裡的現代杏壇，蘆葦間的永恆學堂 \n\n 本計畫以「永貞・蘆映書院」為核心願景，將 180 平方公尺的老舊圖書室，轉化為隱身於知識蘆葦叢中的「微型紅磚聚落」。透過空間轉譯，連結在地「蘆竹湳古厝」的歷史記憶與「永貞國小」的校本精神，打造一座兼具文化底蘊、數位科技與人文溫度的現代化閱讀基...","local_media":"","media_type":"none","attachment_url":"","link_type":"none","youtube_id":"","created_at":"2025-11-29T11:27:23.478Z"},{"id":"3703031976","title":"「永貞・蘆映書院」佈局策略","section_id":"338490854","section_title":"圖書館改建意象2.0","category_id":"library_design","category_name":"圖書館改建意象","body_text":"本計畫依據「左動右靜、中軸服務」之佈局策略，透過**「空間分區再造」 與 「環境設備優化」**兩大策略，將 180 平方公尺的老舊圖書室，轉化為兼具文化底蘊與現代教學功能之「永貞・蘆映書院」：\n\n 策略一：空間分區再造——三大核心場域與六大機能轉化 \n\n 打破傳統方正格局，將空間劃分為無隔間的三大場域，並賦予六大關鍵機能：\n 1. 中軸核心區：服務與策展 (The Central Hub) 此區為全館心臟與門面，整合行政服務、迎賓導引與主題策展功能。\n 機能一：多工服務櫃台區 (Service Core) \n 配置： 設置於大門正對面之端景位置。櫃台採「左開放、右資訊」佈局：開口朝左便於支援教學區；右側封閉立面掛置 2 組讀者查詢平板 。後場整合收納與意象主牆，提升行政效率。\n 機能二：入口新書區「蘆花初綻」 (New Books Display) \n 配置： 於入口處設置具垂直線條語彙（模擬蘆葦叢）的 流線型低矮中島 。作為每月新書伸展台，既提供視覺焦點，亦維持視線通透，營造明亮迎賓氛圍。\n 機能三：主題策展區「磚牆藝廊」 (Thematic Curation) \n 配置： 位於中軸與右翼之間，配置 移動式屋型中島 。A 面採用陶土橘洞洞板展示學生作品或 SDGs 議題；同時作為空間的「視覺濾網」，巧妙區隔動靜場域。\n 2. 左翼教學區：動態展演 (The Teaching Wing) 以「架高地坪」界定場域，專注於「雙語晨讀」與「多媒體教學」，打造全校最溫馨的故事屋。\n 機能四：中心教學區「杏壇稻埕」 (Teaching Center) \n 配置： 鋪設範圍達左翼 2/3 面積的架高木地板，提供容納一班學生席地而坐的空間。主牆配置 86 吋觸控螢幕 與 滑動白板 ，天花板懸掛 「蘿蔔燈・光之樹」 意象裝置。入口側另設有 期刊報紙架 與 還書箱 ，完善周邊機能。\n 3. 右翼閱讀區：靜謐共學 (The Reading Wing) 為高密度藏書與深度學習區，強調「沉浸體驗」與「協作探究」，落實自主學習精神。\n 機能五：閱讀區「古厝書房」 (Immersive Reading) \n 配置： 中央配置 4 座流線型低矮書架 引導動線；四周牆面設置 160cm 高書櫃 滿足 10,000 冊藏書需求，並嵌入 「月洞門小窩居」 （內含閱讀燈），提供沉浸式閱讀體驗。\n 機能六：學習區「琢玉工坊」 (Inquiry & Study) \n 配置： 位於右翼入口光線充足處，配置 16 張梯形積木桌 （可拼成 4 組討論島），支援 PBL 小組討論；窗邊另設有 長條 Bar 台 ，提供社區民眾與教師舒適閱讀座位。\n\n 策略二：環境設備優化與色彩計畫——溫潤大地・晨光書院 \n\n 1. 色彩與材質計畫： \n 溫潤基調： 以高明度、耐髒污材質為主。全區鋪設 SPC 石塑地板 ，採分區跳色設計（教學區仿木紋、走道區仿磨石子），具備防水、耐磨、靜音特性。\n 在地配色： 點綴學校代表色及在地意象色彩，如「陶土橘」（紅磚）、「海軍藍」（客家藍衫/夜讀），營造溫潤且易於維護的空間。\n 2. 光環境與物理環境改善： \n 健康照明： 全面汰換老舊燈具，導入高演色性 LED 平板燈（4000K 自然光），經光度計模擬確保閱讀面照度達 570 Lux 標準，保護學童視力。\n 安全規範： 所有木作櫃體轉角與活動家具皆採 R 角（圓弧）收邊 處理，確保學童活動安全無虞。\n 3. 數位智慧導入： \n 增設 自助查詢平板 與 大型觸控教學螢幕 ，提升學生資訊素養，並透過數位設備支援多樣化教學活動。","body_html":"<p>本計畫依據「左動右靜、中軸服務」之佈局策略，透過**「空間分區再造」 與 「環境設備優化」**兩大策略，將 180 平方公尺的老舊圖書室，轉化為兼具文化底蘊與現代教學功能之「永貞・蘆映書院」：</p><p>策略一：空間分區再造——三大核心場域與六大機能轉化</p><p>打破傳統方正格局，將空間劃分為無隔間的三大場域，並賦予六大關鍵機能：</p><p>1. 中軸核心區：服務與策展 (The Central Hub) 此區為全館心臟與門面，整合行政服務、迎賓導引與主題策展功能。</p><p>機能一：多工服務櫃台區 (Service Core)</p><p>配置： 設置於大門正對面之端景位置。櫃台採「左開放、右資訊」佈局：開口朝左便於支援教學區；右側封閉立面掛置 2 組讀者查詢平板 。後場整合收納與意象主牆，提升行政效率。</p><p>機能二：入口新書區「蘆花初綻」 (New Books Display)</p><p>配置： 於入口處設置具垂直線條語彙（模擬蘆葦叢）的 流線型低矮中島 。作為每月新書伸展台，既提供視覺焦點，亦維持視線通透，營造明亮迎賓氛圍。</p><p>機能三：主題策展區「磚牆藝廊」 (Thematic Curation)</p><p>配置： 位於中軸與右翼之間，配置 移動式屋型中島 。A 面採用陶土橘洞洞板展示學生作品或 SDGs 議題；同時作為空間的「視覺濾網」，巧妙區隔動靜場域。</p><p>2. 左翼教學區：動態展演 (The Teaching Wing) 以「架高地坪」界定場域，專注於「雙語晨讀」與「多媒體教學」，打造全校最溫馨的故事屋。</p><p>機能四：中心教學區「杏壇稻埕」 (Teaching Center)</p><p>配置： 鋪設範圍達左翼 2/3 面積的架高木地板，提供容納一班學生席地而坐的空間。主牆配置 86 吋觸控螢幕 與 滑動白板 ，天花板懸掛 「蘿蔔燈・光之樹」 意象裝置。入口側另設有 期刊報紙架 與 還書箱 ，完善周邊機能。</p><p>3. 右翼閱讀區：靜謐共學 (The Reading Wing) 為高密度藏書與深度學習區，強調「沉浸體驗」與「協作探究」，落實自主學習精神。</p><p>機能五：閱讀區「古厝書房」 (Immersive Reading)</p><p>配置： 中央配置 4 座流線型低矮書架 引導動線；四周牆面設置 160cm 高書櫃 滿足 10,000 冊藏書需求，並嵌入 「月洞門小窩居」 （內含閱讀燈），提供沉浸式閱讀體驗。</p><p>機能六：學習區「琢玉工坊」 (Inquiry &amp; Study)</p><p>配置： 位於右翼入口光線充足處，配置 16 張梯形積木桌 （可拼成 4 組討論島），支援 PBL 小組討論；窗邊另設有 長條 Bar 台 ，提供社區民眾與教師舒適閱讀座位。</p><p>策略二：環境設備優化與色彩計畫——溫潤大地・晨光書院</p><p>1. 色彩與材質計畫：</p><p>溫潤基調： 以高明度、耐髒污材質為主。全區鋪設 SPC 石塑地板 ，採分區跳色設計（教學區仿木紋、走道區仿磨石子），具備防水、耐磨、靜音特性。</p><p>在地配色： 點綴學校代表色及在地意象色彩，如「陶土橘」（紅磚）、「海軍藍」（客家藍衫/夜讀），營造溫潤且易於維護的空間。</p><p>2. 光環境與物理環境改善：</p><p>健康照明： 全面汰換老舊燈具，導入高演色性 LED 平板燈（4000K 自然光），經光度計模擬確保閱讀面照度達 570 Lux 標準，保護學童視力。</p><p>安全規範： 所有木作櫃體轉角與活動家具皆採 R 角（圓弧）收邊 處理，確保學童活動安全無虞。</p><p>3. 數位智慧導入：</p><p>增設 自助查詢平板 與 大型觸控教學螢幕 ，提升學生資訊素養，並透過數位設備支援多樣化教學活動。</p>","snippet":"本計畫依據「左動右靜、中軸服務」之佈局策略，透過**「空間分區再造」 與 「環境設備優化」**兩大策略，將 180 平方公尺的老舊圖書室，轉化為兼具文化底蘊與現代教學功能之「永貞・蘆映書院」：\n\n 策略一：空間分區再造——三大核心場域與六大機能轉化 \n\n 打破傳統方正格局，將空間劃分為無隔間的三大場...","local_media":"","media_type":"none","attachment_url":"","link_type":"none","youtube_id":"","created_at":"2025-11-29T11:27:03.344Z"},{"id":"3701825950","title":"永貞國小六年甲班－多元學習活動影像紀錄🤡","sec kXW99RReKkJFIoMoKio2bPgpfz1zCOv5GmYa26UsVP9IjMZzBZ-h4q3X8f4Uay5j_g1Ul0kNhHMVNtwb9Qg9Ir1cZbTHafEtOxu5BJcg0FleNnkqco-cnieIUAWKVCm6OTPlrugJU_uz14u93HRXrDjBPTUeD2s89wHdCmZWy1Vab8FaNwupnS5s244gt4","link_type":"web","youtube_id":"","created_at":"2025-11-25T13:55:03.869Z"},{"id":"3697996342","title":"11/25【永貞・蘆映書院】空間規劃論述","section_id":"337772347","section_title":"圖書館改建意象","category_id":"library_design","category_name":"圖書館改建意象","body_text":"【永貞・蘆映書院】空間分區規劃論述 (優化定稿版)\n\n 核心設計敘事：\n 以「古厝裡的現代杏壇，蘆葦間的永恆學堂」為願景，將 180 平方公尺的圖書館轉化為隱身於知識蘆葦叢中的微型聚落。動線如同穿梭在蘆竹湳的蜿蜒巷弄，從外圍的熱鬧（展示）過渡到內部的靜謐（閱讀），最終匯聚於核心的傳承（教學）與協作（琢玉）。\n\n 1. 入口新書區：「蘆花初綻」 (The Reeds Entrance)\n\n 設計意象： 「撥開蘆葦見真章」。\n 空間機能： * 光影格柵： 入口設置仿蘆葦造型的淺木色格柵，不僅作為空間的視覺屏障，更模擬風吹蘆葦的動態光影，讓學生在踏入圖書館的瞬間，完成心情的沉澱與轉換。\n 中島展示台： 設置高度適齡（80-100cm）的流線型中島，作為每月新書與主題書展的伸展台，取代傳統高櫃壓迫感，吸引學生360度環繞取閱。\n\n 2. 主題策展區：「磚牆藝廊」 (Floating Brick Village)\n\n 設計意象： 「移動的紅磚聚落」。\n 空間機能： * 雙面策展中島： 將原本固定的紅磚牆轉化為數座錯落的「雙面中島書櫃」。A面採用 陶土橘（Terracotta）美耐皿洞洞板 ，結合白色山形屋頂骨架，營造「屋中屋」的策展櫥窗，展示學生立體作品；B面則作為期刊與主題圖書收納。\n 彈性展場： 櫃體底部配置隱藏腳輪，平時是巷弄般的展示廊道，舉辦大型活動時可推開淨空，展現極高的空間靈活度。\n\n 3. 中心教學區：「杏壇稻埕」 (The Courtyard)\n\n 設計意象： 「樹下的金聲玉振」。\n 空間機能： * 蘿蔔燈・光之樹： 空間核心懸掛現代化轉譯的「蘿蔔燈」裝置（採用 Tyvek 杜邦紙或霧面材質），散發暖黃光暈，象徵點亮孩子的智慧與希望。\n 階梯舞台： 設置兩階式寬闊木平台，鋪設耐磨編織紋地坪。平時是師生席地而坐的「稻埕」共讀區，上課時則變身為說故事與雙語晨讀的展演舞台。\n\n 4. 閱讀區：「古厝書房」 (Reading Lounge & Book Lanes)\n\n 設計意象： 「時光窗景與海量書海」。\n 空間機能： * 高密度藏書系統： 因應 10,000 冊藏書需求，沿牆面設置頂天立地的鋼構木皮書牆，搭配垂直於窗戶排列的雙面書巷，利用「垂直收納」釋放活動空間。\n 窗邊臥榻與月洞門： 沿窗設置連續臥榻，結合雷射切割的「鐵窗花」光影；書牆中嵌入海軍藍（Navy Blue）軟包的「月洞門」閱讀窩，提供孩子如躲進秘密基地般的包覆感與安全感。\n\n 5. 學習區：「琢玉工坊」 (Maker & Study Zone)\n\n 設計意象： 「聚散自如的智慧拼圖」。\n 空間機能： * 梯形積木桌： 全面導入具備腳輪的「梯形組合桌」。單桌可獨立自修，雙桌對拼成鑽石型可進行 PBL 小組討論，六桌則可拼成大圓桌進行創客分享。\n 協作場域： 透過家具的靈活重組，此區打破傳統教室僵化排列，支援從「個人專注」到「團體協作」的多樣化教學模式，呼應切磋琢磨的教育精神。\n\n 💡 論述優化重點解析（給評審看的亮點）\n\n 在撰寫計畫書時，若有簡報或口頭說明的機會，請特別強調以下三點「改變」：\n 從「裝修」變「策展」：\n 強調第2區的「磚牆藝廊」不只是裝潢，而是為了配合學校的 SDGs 議題策展 2與 雙語說書人活動 3 所設計的教學載體。\n 從「收納」變「地景」：\n 強調第4區的高書櫃與第2區的中島，解決了 10,000 本藏書 的壓力，但透過「巷弄排列」與「屋中屋造型」，讓書櫃變成蘆竹湳聚落的地景，而非死板的倉庫。\n 從「固定」變「彈性」：\n 強調第5區的「梯形桌」，是為了適應未來 108課綱跨領域探究 4 的需求，讓空間能跟著課程變形。","body_html":"<p>【永貞・蘆映書院】空間分區規劃論述 (優化定稿版)</p><p>核心設計敘事：</p><p>以「古厝裡的現代杏壇，蘆葦間的永恆學堂」為願景，將 180 平方公尺的圖書館轉化為隱身於知識蘆葦叢中的微型聚落。動線如同穿梭在蘆竹湳的蜿蜒巷弄，從外圍的熱鬧（展示）過渡到內部的靜謐（閱讀），最終匯聚於核心的傳承（教學）與協作（琢玉）。</p><p>1. 入口新書區：「蘆花初綻」 (The Reeds Entrance)</p><p>設計意象： 「撥開蘆葦見真章」。</p><p>空間機能： * 光影格柵： 入口設置仿蘆葦造型的淺木色格柵，不僅作為空間的視覺屏障，更模擬風吹蘆葦的動態光影，讓學生在踏入圖書館的瞬間，完成心情的沉澱與轉換。</p><p>中島展示台： 設置高度適齡（80-100cm）的流線型中島，作為每月新書與主題書展的伸展台，取代傳統高櫃壓迫感，吸引學生360度環繞取閱。</p><p>2. 主題策展區：「磚牆藝廊」 (Floating Brick Village)</p><p>設計意象： 「移動的紅磚聚落」。</p><p>空間機能： * 雙面策展中島： 將原本固定的紅磚牆轉化為數座錯落的「雙面中島書櫃」。A面採用 陶土橘（Terracotta）美耐皿洞洞板 ，結合白色山形屋頂骨架，營造「屋中屋」的策展櫥窗，展示學生立體作品；B面則作為期刊與主題圖書收納。</p><p>彈性展場： 櫃體底部配置隱藏腳輪，平時是巷弄般的展示廊道，舉辦大型活動時可推開淨空，展現極高的空間靈活度。</p><p>3. 中心教學區：「杏壇稻埕」 (The Courtyard)</p><p>設計意象： 「樹下的金聲玉振」。</p><p>空間機能： * 蘿蔔燈・光之樹： 空間核心懸掛現代化轉譯的「蘿蔔燈」裝置（採用 Tyvek 杜邦紙或霧面材質），散發暖黃光暈，象徵點亮孩子的智慧與希望。</p><p>階梯舞台： 設置兩階式寬闊木平台，鋪設耐磨編織紋地坪。平時是師生席地而坐的「稻埕」共讀區，上課時則變身為說故事與雙語晨讀的展演舞台。</p><p>4. 閱讀區：「古厝書房」 (Reading Lounge &amp; Book Lanes)</p><p>設計意象： 「時光窗景與海量書海」。</p><p>空間機能： * 高密度藏書系統： 因應 10,000 冊藏書需求，沿牆面設置頂天立地的鋼構木皮書牆，搭配垂直於窗戶排列的雙面書巷，利用「垂直收納」釋放活動空間。</p><p>窗邊臥榻與月洞門： 沿窗設置連續臥榻，結合雷射切割的「鐵窗花」光影；書牆中嵌入海軍藍（Navy Blue）軟包的「月洞門」閱讀窩，提供孩子如躲進秘密基地般的包覆感與安全感。</p><p>5. 學習區：「琢玉工坊」 (Maker &amp; Study Zone)</p><p>設計意象： 「聚散自如的智慧拼圖」。</p><p>空間機能： * 梯形積木桌： 全面導入具備腳輪的「梯形組合桌」。單桌可獨立自修，雙桌對拼成鑽石型可進行 PBL 小組討論，六桌則可拼成大圓桌進行創客分享。</p><p>協作場域： 透過家具的靈活重組，此區打破傳統教室僵化排列，支援從「個人專注」到「團體協作」的多樣化教學模式，呼應切磋琢磨的教育精神。</p><p>💡 論述優化重點解析（給評審看的亮點）</p><p>在撰寫計畫書時，若有簡報或口頭說明的機會，請特別強調以下三點「改變」：</p><p>從「裝修」變「策展」：</p><p>強調第2區的「磚牆藝廊」不只是裝潢，而是為了配合學校的 SDGs 議題策展 2與 雙語說書人活動 3 所設計的教學載體。</p><p>從「收納」變「地景」：</p><p>強調第4區的高書櫃與第2區的中島，解決了 10,000 本藏書 的壓力，但透過「巷弄排列」與「屋中屋造型」，讓書櫃變成蘆竹湳聚落的地景，而非死板的倉庫。</p><p>從「固定」變「彈性」：</p><p>強調第5區的「梯形桌」，是為了適應未來 108課綱跨領域探究 4 的需求，讓空間能跟著課程變形。</p>","snippet":"【永貞・蘆映書院】空間分區規劃論述 (優化定稿版)\n\n 核心設計敘事：\n 以「古厝裡的現代杏壇，蘆葦間的永恆學堂」為願景，將 180 平方公尺的圖書館轉化為隱身於知識蘆葦叢中的微型聚落。動線如同穿梭在蘆竹湳的蜿蜒巷弄，從外圍的熱鬧（展示）過渡到內部的靜謐（閱讀），最終匯聚於核心的傳承（教學）與協作（...","local_media":"","media_type":"none","attachment_url":"","link_type":"none","youtube_id":"","created_at":"2025-11-25T13:44:09.079Z"},{"id":"3697993252","title":"圖書館改建意象","section_id":"337772347","section_title":"圖書館改建意象","category_id":"library_design","category_name":"圖書館改建意象","body_text":"","body_html":"","snippet":"📷 點擊查看詳細成果照片、學生作品展示與活動圖文紀錄。","local_media":"assets/media/wish_3697993252.png","media_type":"image","attachment_url":"https://u1.padletusercontent.com/uploads/padlet-uploads-usc1/2633604001/7a8468360f666d6b5dc851ac4e0e48f3/Gemini_Generated_Image_tu2kectu2kectu2k.png?expiry_token=5WaHZRdGG3LkUVQGy3SZ-zdRtq89aJeottSBaF_Hii8dmxJqYDvE2-MDbblcM-ZrVekXW99RReKkJFIoMoKio2bPgpfz1zCOv5GmYa26UsV-L_BWtGP1kzEaveBiE6W6TJsgWbuOGCeagIPzjV2IWR0yn9EsNtvlKjleBjs_bExrg3C7Wi2PqKjnJqEA9XjnN79d6HjZH0NgljAgAvxZsQ8lZwhmLTW8XH3ccMYkExtlb3qCfwKTkaGFbr2A5AdP","link_type":"web","youtube_id":"","created_at":"2025-11-25T13:41:53.232Z"},{"id":"3697993088","title":"圖書館改建意象","section_id":"337772347","section_title":"圖書館改建意象","category_id":"library_design","category_name":"圖書館改建意象","body_text":"","body_html":"","snippet":"📷 點擊查看詳細成果照片、學生作品展示與活動圖文紀錄。","local_media":"assets/media/wish_3697993088.png","media_type":"image","attachment_url":"https://u1.padletusercontent.com/uploads/padlet-uploads-usc1/2633604001/08769ec1ada658c7c94fbd58261fb387/Gemini_Generated_Image_altdi8altdi8altd.png?expiry_token=5WaHZRdGG3LkUVQGy3SZ-zdRtq89aJeottSBaF_Hii8dmxJqYDvE2-MDbblcM-ZrVekXW99RReKkJFIoMoKio2bPgpfz1zCOv5GmYa26UsV6vFb47yxjlAVxBHscrWfGgnbjhnb_gimMebkyo79RbVJPMNU4_uBWwKfghQhQupaz_wE2eU_CBk4UeyhFVVHAg3eaMrDOOepqm-jI97vupw7VH7C8keeNV3Yra8LgVjxG3sUQX0kXc0EKBCiHPUNy","link_type":"web","youtube_id":"","created_at":"2025-11-25T13:41:46.492Z"},{"id":"3697988436","title":"人是會思想的蘆葦","section_id":"332194327","section_title":"六甲-主題書展(一)","category_id":"book_exhibitions","category_name":"主題書展專區","body_text":"人是會思想的蘆葦 \n 汶俊 (筆名：無言) \n 人氣格鬥士 \n 發佈於 書史小齋 \n 2019/06/27 更新2019/06/27 發佈閱讀 2 分鐘\n 分享段落 \n 「人是會思想的蘆葦」出自法國哲學家帕斯卡 (Blaise Pascal) 的《思想錄》，全文是「人只不過是一根葦草，是自然界最脆弱的東西；但是，他卻是一根能思想的葦草」。\n 帕斯卡是十七世紀的人，十四至十六世紀，歐洲正進行文藝復興，在此之前，神權凌駕人權，一句「哲學是神學的婢女」，道出了中世紀的時代精神。\n\n 為什麼會看到廣告\n 文藝復興恢復以人為本位，帕斯卡受惠於文藝復興的成果，繼而重視人會思想的能力，此語一出，跟古希臘蘇柏亞對人的理性的重視遙相呼應，整個理性傳統被復活了。\n\n 帕斯卡認為，思想令人擁有全部的尊嚴，令人獲得尊重，而獲得尊重是幸福人生不可或缺的部份，換言之，理性運用為人帶來幸福。\n 中國傳統雖以人為本，但不太著重人會思想，反而更強調實踐修行。人能透過具體工夫成就道德行為 / 達至逍遙自在，故與草木鳥獸異，會不會思想並非重點，有別於帕斯卡。\n 《思想錄》1669 -1670 年出版，是瑣屑筆記拼湊而成。\n 全書極力為基督教辯護，特別提出「賭博論證」：上帝存在雖不能被理性證明，我們仍應該相信上帝存在。賭上帝存在時，如果上帝真的存在，信奉上帝的人會獲全勝，有無限的得益，獲得幸福。即使上帝真的不存在，也無多大損失。\n 另外，對於人生脆弱不堪、世事無常等，帕斯卡都有所闡述。\n 帕斯卡還說過「真正的辯才輕視辯才，真正的德性輕視德性」、「把實話說出來對聽的人有益，但對說的人是有害的，因為他會遭到厭惡」、「充滿錯誤確實不善，但充滿錯誤又不願去承認它們則是更大的不善」，對今後參與政治的人士亦有警醒作用。\n\n #帕斯卡的賭注 #帕斯卡 #西方哲學 #理性主義 #西方文化 #名言佳句","body_html":"<p>人是會思想的蘆葦</p><p>汶俊 (筆名：無言)</p><p>人氣格鬥士</p><p>發佈於 書史小齋</p><p>2019/06/27 更新2019/06/27 發佈閱讀 2 分鐘</p><p>分享段落</p><p>「人是會思想的蘆葦」出自法國哲學家帕斯卡 (Blaise Pascal) 的《思想錄》，全文是「人只不過是一根葦草，是自然界最脆弱的東西；但是，他卻是一根能思想的葦草」。</p><p>帕斯卡是十七世紀的人，十四至十六世紀，歐洲正進行文藝復興，在此之前，神權凌駕人權，一句「哲學是神學的婢女」，道出了中世紀的時代精神。</p><p>為什麼會看到廣告</p><p>文藝復興恢復以人為本位，帕斯卡受惠於文藝復興的成果，繼而重視人會思想的能力，此語一出，跟古希臘蘇柏亞對人的理性的重視遙相呼應，整個理性傳統被復活了。</p><p>帕斯卡認為，思想令人擁有全部的尊嚴，令人獲得尊重，而獲得尊重是幸福人生不可或缺的部份，換言之，理性運用為人帶來幸福。</p><p>中國傳統雖以人為本，但不太著重人會思想，反而更強調實踐修行。人能透過具體工夫成就道德行為 / 達至逍遙自在，故與草木鳥獸異，會不會思想並非重點，有別於帕斯卡。</p><p>《思想錄》1669 -1670 年出版，是瑣屑筆記拼湊而成。</p><p>全書極力為基督教辯護，特別提出「賭博論證」：上帝存在雖不能被理性證明，我們仍應該相信上帝存在。賭上帝存在時，如果上帝真的存在，信奉上帝的人會獲全勝，有無限的得益，獲得幸福。即使上帝真的不存在，也無多大損失。</p><p>另外，對於人生脆弱不堪、世事無常等，帕斯卡都有所闡述。</p><p>帕斯卡還說過「真正的辯才輕視辯才，真正的德性輕視德性」、「把實話說出來對聽的人有益，但對說的人是有害的，因為他會遭到厭惡」、「充滿錯誤確實不善，但充滿錯誤又不願去承認它們則是更大的不善」，對今後參與政治的人士亦有警醒作用。</p><p>#帕斯卡的賭注 #帕斯卡 #西方哲學 #理性主義 #西方文化 #名言佳句</p>","snippet":"人是會思想的蘆葦 \n 汶俊 (筆名：無言) \n 人氣格鬥士 \n 發佈於 書史小齋 \n 2019/06/27 更新2019/06/27 發佈閱讀 2 分鐘\n 分享段落 \n 「人是會思想的蘆葦」出自法國哲學家帕斯卡 (Blaise Pascal) 的《思想錄》，全文是「人只不過是一根葦草，是自然界最脆弱...","local_media":"","media_type":"none","attachment_url":"https://vocus.cc/user/@davidlai1988","link_type":"web","youtube_id":"","created_at":"2025-11-25T13:38:48.568Z"},{"id":"3697894842","title":"20251124繪本錄音檔","section_id":"337434138","section_title":"20251124繪本錄音檔","category_id":"storytellers","category_name":"明日說書人與有聲書","body_text":"","body_html":"","snippet":"📷 點擊查 "body_html":"","snippet":"📖 點擊查看本單元閱讀推動完整規劃、教學設計與延伸成果。","local_media":"","media_type":"none","attachment_url":"https://gemini.google.com/share/b43dba5292ff","link_type":"gemini","youtube_id":"","created_at":"2025-10-16T13:56:07.145Z"},{"id":"3631618404","title":"99-秉鴻","section_id":"328412309","section_title":"「人事時地」故事法","category_id":"literacy_issues","category_name":"素養深耕與多元議題","body_text":"2025年10月14日 星期二 酷熱難耐的晴天\n 地點： 樂樂棒球比賽場地\n 今天，是我們隊伍的樂樂棒球決戰日。一大早就是個酷熱難耐的大晴天，溫度飆破32度，連空氣都帶著滾燙的熱浪。\n 原本充滿希望，畢竟我們有「實力哥」坐鎮捕手這個中央位置——他這個人，確實有實力，但不多，總讓人捏一把冷汗。\n 比賽開始，他果然被這高溫和壓力壓垮了。四顆球從他的胯下穿堂而過，那畫面簡直像在演一場荒謬劇！身為隊長，他的眼睛似乎完全沒跟上球的軌跡，球從他頭邊、左右兩側呼嘯而過時，他只是一直維持著快要跌倒的狼狽姿勢。我們眼睜睜看著機會溜走，比分被拉開，最後，無奈地吞下敗仗。\n 隊友們在高溫中失落溢於言表，而身為隊長的實力哥，臉上帶著一種說不上來的懊惱。\n 直到下午，當正式的勝負已定，天氣的熱度似乎也稍稍緩和，我們與其他學校進行輕鬆的友誼賽時，奇蹟發生了。\n 他彷彿換了一個人！防守時，他開始精準地接球、傳球給壘上隊友封殺。進攻時，每一棒都確實擊出，跑壘得分，活力全開！那份遲來的**「實力」**終於展現，動作流暢而精準，彷彿上午那個被熱昏的捕手是另一個人假扮的。\n 可惜，勝利女神已經離去。這份精彩絕倫的表現，終究只能停留在輕鬆的友誼賽場上。\n 如果他能抵擋住上午那超過32度的高溫和壓力，結果會不會完全不同？","body_html":"<p>2025年10月14日 星期二 酷熱難耐的晴天</p><p>地點： 樂樂棒球比賽場地</p><p>今天，是我們隊伍的樂樂棒球決戰日。一大早就是個酷熱難耐的大晴天，溫度飆破32度，連空氣都帶著滾燙的熱浪。</p><p>原本充滿希望，畢竟我們有「實力哥」坐鎮捕手這個中央位置——他這個人，確實有實力，但不多，總讓人捏一把冷汗。</p><p>比賽開始，他果然被這高溫和壓力壓垮了。四顆球從他的胯下穿堂而過，那畫面簡直像在演一場荒謬劇！身為隊長，他的眼睛似乎完全沒跟上球的軌跡，球從他頭邊、左右兩側呼嘯而過時，他只是一直維持著快要跌倒的狼狽姿勢。我們眼睜睜看著機會溜走，比分被拉開，最後，無奈地吞下敗仗。</p><p>隊友們在高溫中失落溢於言表，而身為隊長的實力哥，臉上帶著一種說不上來的懊惱。</p><p>直到下午，當正式的勝負已定，天氣的熱度似乎也稍稍緩和，我們與其他學校進行輕鬆的友誼賽時，奇蹟發生了。</p><p>他彷彿換了一個人！防守時，他開始精準地接球、傳球給壘上隊友封殺。進攻時，每一棒都確實擊出，跑壘得分，活力全開！那份遲來的**「實力」**終於展現，動作流暢而精準，彷彿上午那個被熱昏的捕手是另一個人假扮的。</p><p>可惜，勝利女神已經離去。這份精彩絕倫的表現，終究只能停留在輕鬆的友誼賽場上。</p><p>如果他能抵擋住上午那超過32度的高溫和壓力，結果會不會完全不同？</p>","snippet":"2025年10月14日 星期二 酷熱難耐的晴天\n 地點： 樂樂棒球比賽場地\n 今天，是我們隊伍的樂樂棒球決戰日。一大早就是個酷熱難耐的大晴天，溫度飆破32度，連空氣都帶著滾燙的熱浪。\n 原本充滿希望，畢竟我們有「實力哥」坐鎮捕手這個中央位置——他這個人，確實有實力，但不多，總讓人捏一把冷汗。\n 比賽...","local_media":"assets/media/wish_3631618404.jpg","media_type":"image","attachment_url":"https://u1.padletusercontent.com/uploads/padlet-uploads-usc1/2633604001/4508f60e3c21f8fd6bdb43887fea1109/IMG_1513.jpg?expiry_token=5WaHZRdGG3LkUVQGy3SZ-zdRtq89aJeottSBaF_Hi n\n​除了在外時要多注意，遠離蚊子群聚的地方，平時家裡也要留意潮濕的地方，避免蚊子產卵，尤其是蚊子孳生的夏天。如果被叮咬後很不舒服，可以用看看上面的方法，應該都滿有效的！！！祝大家都可以抗蚊成功～\n\nBy超級討厭蚊子的 Ca 小編","body_html":"<p>進擊的蚊子(番外篇)：來自人類的反擊</p><p>3/30/2022</p><p>那一天，人類終於想起被支配的恐懼，</p><p>不管在外面、家裡，甚至是被窩裡，總會被蚊子襲擊，</p><p>搞得身上一個又一個的包，癢死了 (ಥ﹏ಥ)</p><p>究竟有沒有止癢的方法呢？快來看看吧！</p><p>Photo credit: icon0.com via pexels. CC-BY-NC 2.0</p><p>​蚊子的攻擊相信大家都會覺得超困擾！被叮腫的包不僅很癢，若是一直抓還容易抓破皮，但生活中又很難擺脫牠們，如果想解決被叮咬的腫癢，就得先認識蚊子！</p><p>其實，被蚊子叮咬後的紅腫發癢原因，不是因為蚊子的口器刺傷人，而是因蚊子的唾液。蚊子的唾液有潤滑口器的功能，同時能防止血液凝固，避免阻塞口器。這種抗凝血劑是一種 蛋白質 ，會使人體內的免疫系統發生反應，產生 組織胺 ，用來抵禦外來物質。而這一連串的免疫反應，就會造成被叮咬的部位過敏，進而覺得癢。當血液流向傷口，加速組織復原時，組織胺會造成傷口附近的皮膚腫脹、發紅。</p><p>Photo credit: Saydung89 via pixabay. CC0</p><p>​那麼問題來了！被蚊子叮咬後有什麼方法可以止癢呢？小編列舉了幾個簡單的方法：</p><p>​</p><p>1.用肥皂或肥皂水在紅腫處塗抹，因肥皂主要成分為 脂肪酸鈉鹽 ，當其水解後呈鹼性(含 OH- )，可與蚊子唾液中的 蟻酸 (含 H ，呈酸性) 中和成水(H2O)，迅速消除痛癢。</p><p>2.使用冰敷！此做法是大家都很熟悉的方法，可減輕紅腫，但冰敷時有幾點注意事項，將冰塊裝入袋內時，先放一半冰，再加入一半水，密封好，並用毛巾包裹後敷在被叮咬的地方。敷15至20分鐘，每天3至4次，不要敷太久，不然容易凍傷，要小心！</p><p>3.使用蘆薈凝膠也是其中一個方法，因蘆薈具有抗炎特性，可用於傷口癒合和避免感染，凝膠的涼爽感也可以緩解搔癢。</p><p>Photo credit: freepik</p><p>​除了在外時要多注意，遠離蚊子群聚的地方，平時家裡也要留意潮濕的地方，避免蚊子產卵，尤其是蚊子孳生的夏天。如果被叮咬後很不舒服，可以用看看上面的方法，應該都滿有效的！！！祝大家都可以抗蚊成功～</p><p>By超級討厭蚊子的 Ca 小編</p>","snippet":"進擊的蚊子(番外篇)：來自人類的反擊 \n 3/30/2022\n\n 那一天，人類終於想起被支配的恐懼，\n不管在外面、家裡，甚至是被窩裡，總會被蚊子襲擊，\n搞得身上一個又一個的包，癢死了 (ಥ﹏ಥ)\n究竟有沒有止癢的方法呢？快來看看吧！\n Photo credit: icon0.com via pexe...","local_media":"","media_type":"none","attachment_url":"https://www.lifechem.tw/blog/220306","link_type":"web","youtube_id":"","created_at":"2025-10-05T13:36:46.333Z"},{"id":"3611276642","title":"18-楊雅閑-小豬噗噗的神奇耳朵","section_id":"321863599","section_title":"好書推薦影片","category_id":"storytellers","category_name":"明日說書人與有聲書","body_text":"各位同學大家好 我是楊雅閑\n 我今天要推薦的書是小豬噗噗的神奇耳朵\n\n 作者是神澤利子\n 出版社是東方出版社\n\n 小豬噗噗有一對神奇的耳朵👂，而且他還聽的到其他動物聽不到的聲音。\n 因此他也用這個能力幫助朋友，並思考🤔自己該怎麼使用這份特別的能力。\n\n 我感覺小豬噗噗很活潑，是一位好奇喜歡探索新事物的人。🤓\n 每當有動物遇到困難時，小豬噗噗也都會幫忙解決問題。\n 因此，小豬噗噗是一個真是熱心助人❤️，就和大家所認識的多拉A夢一樣，都會使用他的能力，來幫助有需要的人。\n\n 這本書小豬噗噗有一對神奇的耳朵精彩👍，\n 希望大家可以借借看，真的很好看喔！🙂‍↕️\n 我的推薦到此結束，謝謝大家🙏","body_html":"<p>各位同學大家好 我是楊雅閑</p><p>我今天要推薦的 B隊不小心拿到損毁的材料，因插陽差導致韓國A隊慘遭淘汰⋯⋯對為了解開誤會並表達歉意，決定為A隊打造專屬的發明品！即使是小發明，也能帶來重大的改變\n 我想推薦這本書的原因是怎樣，因為他透過環保LED煙火以及V R裝置和罐頭蓋等發明品，學習煙火的原理，與火焰顏色和虛擬實境以及槓桿原理等科學知識，讓我更加的喜歡生活中的物品，學習科學原理！真的是小發明，也帶來重大的改變了\n 這本書最特別的是不管他們發生什麼？突然的意外都有辦法化險為夷，希望你們可以去借這本書，也很適合推薦給喜歡科學的人，謝謝大家！","body_html":"<p>📚 說書聊書作品</p><p>推薦書籍：科學發明王</p><p>完成時間：2025/9/9 下午2:24:56</p><p>字數：336 字</p><p>各位同學大家好，我是吳丞諺</p><p>今天我要推薦的書名是：科學發明王</p><p>作者是外國人譯者徐月珠，</p><p>出版社是：三采文化</p><p>韓國B隊以瓶蓋與標籤設計，順利晉級世界發明奧林匹亞大賽，但是韓國B隊不小心拿到損毁的材料，因插陽差導致韓國A隊慘遭淘汰⋯⋯對為了解開誤會並表達歉意，決定為A隊打造專屬的發明品！即使是小發明，也能帶來重大的改變</p><p>我想推薦這本書的原因是怎樣，因為他透過環保LED煙火以及V R裝置和罐頭蓋等發明品，學習煙火的原理，與火焰顏色和虛擬實境以及槓桿原理等科學知識，讓我更加的喜歡生活中的物品，學習科學原理！真的是小發明，也帶來重大的改變了</p><p>這本書最特別的是不管他們發生什麼？突然的意外都有辦法化險為夷，希望你們可以去借這本書，也很適合推薦給喜歡科學的人，謝謝大家！</p>","snippet":"📚 說書聊書作品\n 推薦書籍：科學發明王\n 完成時間：2025/9/9 下午2:24:56\n 字數：336 字\n 各位同學大家好，我是吳丞諺\n 今天我要推薦的書名是：科學發明王\n 作者是外國人譯者徐月珠，\n 出版社是：三采文化\n 韓國B隊以瓶蓋與標籤設計，順利晉級世界發明奧林匹亞大賽，但是韓國B隊...","local_media":"assets/media/wish_3575450778.png","media_type":"image","attachment_url":"https://u1.padletusercontent.com/uploads/padlet-uploads-usc1/2633604001/68d68d74c087efe7092a3f7ac1685b95/image.png?expiry_token=5WaHZRdGG3LkUVQGy3SZ-zdRtq89aJeottSBaF_Hii8dmxJqYDvE2-MDbblcM-ZrVekXW99RReKkJFIoMoKio2bPgpfz1zCOv5GmYa26UsXyVkehId2HUsDPgCXgYRKAIGzOWZY5INJudsdCVtV7PkfyY3fiOx2MQd91k1EWnGwbzN5utO3NWD0s0Qy54qUXH7fw-oA65hRBqtKLSXFKtg==","link_type":"web","youtube_id":"","created_at":"2025-09-09T06:26:47.142Z"},{"id":"3575407074","title":"20-秉鴻-刻意練習","section_id":"319319557","section_title":"說書分享文字檔","category_id":"storytellers","category_name":"明日說書人與有聲書","body_text":"📚 說書聊書作品\n 推薦書籍：刻意練習\n 完成時間：2025/9/9 下午2:03:40\n 字數：320 字\n 各位同學大家好！我是秉鴻老師\n 今天我要推薦的書名是：刻意練習\n 這本書的作者是：埃里克森 和 普爾\n 出版社是： 方智 出版社\n 這本書主要是在說…\n 刻意練習的方式與功能，主要是設定明確、具體的目標，在練習時保持專注，並且尋求教練或他人的意見回饋，依此持續修正錯誤並調整策略，有意識地挑戰舒適圈，不斷突破現有能力\n 我會想推薦這本書的原因是…\n 因為現在的學業變難了，我希望能更進步一些。發現到刻意練習這本書，提到刻意練習目的是為了「打造」潛能。練習針對弱點，來到達「可接受」的程度，並需要設定新目標來突破。 透過不斷重複「專注、回饋、修正」的循環，逐步提升技能。\n 這本書的內容很精彩，希望大家有空都能借來看看。\n 我的推薦到此結束，謝謝大家","body_html":"<p>📚 說書聊書作品</p><p>推薦書籍：刻意練習</p>< 50fd897800012ce8ad","link_type":"web","youtube_id":"","created_at":"2024-10-23T06:31:04.292Z"},{"id":"3183140401","title":"角色扮演","section_id":"257961868","section_title":"第二階段 - 深入探索","category_id":"blueprint","category_name":"閱讀推動藍圖與理念","body_text":"安排角色扮演活動，學生可選擇書中角色進行扮演，並在小劇場中重現書中的一個場景。這有助於加深學生對角色的理解。\n\n# 教學目標 \n提高學生的表達能力與同理心","body_html":"<p>安排角色扮演活動，學生可選擇書中角色進行扮演，並在小劇場中重現書中的一個場景。這有助於加深學生對角色的理解。</p><p># 教學目標</p><p>提高學生的表達能力與同理心</p>","snippet":"安排角色扮演活動，學生可選擇書中角色進行扮演，並在小劇場中重現書中的一個場景。這有助於加深學生對角色的理解。\n\n# 教學目標 \n提高學生的表達能力與同理心","local_media":"assets/media/wish_3183140401.jpg","media_type":"image","attachment_url":"https://live.staticflickr.com/5261/5552890099_01238edc48_b.jpg","link_type":"web","youtube_id":"","created_at":"2024-10-23T06:31:02.571Z"},{"id":"3183140390","title":"寫作活動","section_id":"257961856","section_title":"第一階段 - 啟發興趣","category_id":"blueprint","category_name":"閱讀推動藍圖與理念","body_text":"讓每位學生撰寫一篇短文，描述他們個人對書中主題的見解，以及該主題對自己的生活或觀點有何影響。作品可以是隨筆、日記或個人物品描述。\n\n# 教學目標 \n培養學生的反思能力與表達力","body_html":"<p>讓每位學生撰寫一篇短文，描述他們個人對書中主題的見解，以及該主題對自己的生活或觀點有何影響。作品可以是隨筆、日記或個人物品描述。</p><p># 教學目標</p><p>培養學生的反思能力與表達力</p>","snippet":"讓每位學生撰寫一篇短文，描述他們個人對書中主題的見解，以及該主題對自己的生活或觀點有何影響。作品可以是隨筆、日記或個人物品描述。\n\n# 教學目標 \n培養學生的反思能力與表達力","local_media":"assets/media/wish_3183140390.jpg","media_type":"image","attachment_url":"https://live.staticflickr.com/2164/2361681986_77b502cf14_b.jpg","link_type":"web","youtube_id":"","created_at":"2024-10-23T06:31:02.245Z"},{"id":"3183140389","title":"小組討論","section_id":"257961856","section_title":"第一階段 - 啟發興趣","category_id":"blueprint","category_name":"閱讀推動藍圖與理念","body_text":"將學生分成小組，讓他們針對書中的主題進行討論，並分享各自的見解和想法。教師可以提供一些討論問題，比如：\n- 主題對現今社會有何影響？\n- 如你是書中的角色，會如何面對主題中的挑戰？\n\n# 教學目標 \n促進學生的批判性思考及合作學習能力","body_html":"<p>將學生分成小組，讓他們針對書中的主題進行討論，並分享各自的見解和想法。教師可以提供一些討論問題，比如：</p><p>- 主題對現今社會有何影響？</p><p>- 如你是書中的角色，會如何面對主題中的挑戰？</p><p># 教學目標</p><p>促進學生的批判性思考及合作學習能力</p>","snippet":"將學生分成小組，讓他們針對書中的主題進行討論，並分享各自的見解和想法。教師可以提供一些討論問題，比如：\n- 主題對現今社會有何影響？\n- 如你是書中的角色，會如何面對主題中的挑戰？\n\n# 教學目標 \n促進學生的批判性思考及合作學習能力","local_media":"","media_type":"none","attachment_url":"https://flipedu.parenting.com.tw/article/006174","link_type":"web","youtube_id":"","created_at":"2024-10-23T06:31:02.217Z"},{"id":"3183140310","title":"播放相關影片","section_id":"257961856","section_title":"第一階段 - 啟發興趣","category_id":"blueprint","category_name":"閱讀推動藍圖與理念","body_text":"在課堂上播放一段影片，影片內容為書中所探討的主題相關背景介紹或專家訪談。讓學生透過視覺化的形式了解主題。\n\n# 教學目標 \n激發學生對書中主題的興趣，加深理解","body_html":"<p>在課堂上播放一段影片，影片內容為書中所探討的主題相關背景介紹或專家訪談。讓學生透過視覺化的形式了解主題。</p><p># 教學目標</p><p>激發學生對書中主題的興趣，加深理解</p>","snippet":"在課堂上播放一段影片，影片內容為書中所探討的主題相關背景介紹或專家訪談。讓學生透過視覺化的形式了解主題。\n\n# 教學目標 \n激發學生對書中主題的興趣，加深理解","local_media":"","media_type":"video","attachment_url":"https://www.youtube.com/watch?v=jJCkJTLtZUA","link_type":"youtube","youtube_id":"jJCkJTLtZUA","created_at":"2024-10-23T06:30:59.018Z"},{"id":"integrated_1","title":"永貞圖書館閱讀活動剪影 #1","section_id":"sec_integrated_exhibitions","section_title":"永貞圖書館主題書展與全校閱讀推展活動","category_id":"book_exhibitions","category_name":"主題書展專區","body_text":"永貞國小圖書館特色閱讀推廣、主題好書陳列與學生閱讀活動精彩現場照片。","body_html":"<p>永貞國小圖書館特色閱讀推廣、主題好書陳列與學生閱讀活動精彩現場照片。</p>","snippet":"永貞國小圖書館特色閱讀推廣、主題好書陳列與學生閱讀活動精彩現場照片。","local_media":"assets/external_integrated/ext_100_IMG_7644.JPG","media_type":"image","attachment_url":"","link_type":"none","youtube_id":"","created_at":"2026-08-25T08:00:00.000Z"},{"id":"integrated_2","title":"永貞圖書館閱讀活動剪影 #2","section_id":"sec_integrated_exhibitions","section_title":"永貞圖書館主題書展與全校閱讀推展活動","category_id":"book_exhibitions","category_name":"主題書展專區","body_text":"永貞國小圖書館特色閱讀推廣、主題好書陳列與學生閱讀活動精彩現場照片。","body_html":"<p>永貞國小圖書館特色閱讀推廣、主題好書陳列與學生閱讀活動精彩現場照片。</p>","snippet":"永貞國小圖書館特色閱讀推廣、主題好書陳列與學生閱讀活動精彩現場照片。","local_media":"assets/external_integrated/ext_101_IMG_7646.JPG","media_type":"image","attachment_url":"","link_type":"none","youtube_id":"","created_at":"2026-08-25T08:00:00.000Z"},{"id":"integrated_3","title":"永貞圖書館閱讀活動剪影 #3","section_id":"sec_integrated_exhibitions","section_title":"永貞圖書館主題書展與   <script>
    (function () {
      'use strict';

      const data = window.YONGZHEN_READING_DATA;
      if (!data) {
        document.getElementById('cardsGrid').innerHTML = '<p style="text-align:center; padding:2rem;">資料庫載入中或未找到 data.js...</p>';
        return;
      }

      const memoryStorage = {};
      function getSafeStorage(key, defaultVal) {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            const val = window.localStorage.getItem(key);
            return val !== null ? val : defaultVal;
          }
        } catch (e) {
          console.warn('localStorage is restricted; using memory fallback:', e);
        }
        return memoryStorage[key] !== undefined ? memoryStorage[key] : defaultVal;
      }

      function setSafeStorage(key, val) {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.setItem(key, val);
          }
        } catch (e) {
          console.warn('localStorage write failed; saving in memory:', e);
        }
        memoryStorage[key] = val;
      }

      const state = {
        category: 'all',
        mediaType: 'all',
        search: '',
        sortBy: 'newest',
        page: 1,
        perPage: 24,
        theme: getSafeStorage('yz_embed_theme', 'light')
      };

      const el = {
        catTabs: document.getElementById('catTabs'),
        mediaChips: document.getElementById('mediaChips'),
        searchInput: document.getElementById('searchInput'),
        searchClear: document.getElementById('searchClear'),
        sortSelect: document.getElementById('sortSelect'),
        resultsCount: document.getElementById('resultsCount'),
        cardsGrid: document.getElementById('cardsGrid'),
        pagination: document.getElementById('pagination'),
        themeBtn: document.getElementById('themeBtn'),
        modalBackdrop: document.getElementById('modalBackdrop'),
        modalClose: document.getElementById('modalClose'),
        modalMedia: document.getElementById('modalMedia'),
        modalMeta: document.getElementById('modalMeta'),
        modalTitle: document.getElementById('modalTitle'),
        modalContent: document.getElementById('modalContent'),
        modalActions: document.getElementById('modalActions'),
        fabTop: document.getElementById('fabTop'),
        stSec: document.getElementById('stSec'),
        stWish: document.getElementById('stWish'),
        stMed: document.getElementById('stMed'),
        stExt: document.getElementById('stExt')
      };

      function init() {
        applyTheme(state.theme);
        renderStats();
        renderCategories();
        bindEvents();
        renderCards();
      }

      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        setSafeStorage('yz_embed_theme', t);
        if (el.themeBtn) {
          el.themeBtn.innerHTML = t === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
        }
      }

      function renderStats() {
        if (el.stSec) el.stSec.textContent = data.stats.total_sections || 78;
        if (el.stWish) el.stWish.textContent = data.wishes.length || 686;
        if (el.stMed) el.stMed.textContent = (data.stats.total_media || 538) + '+';
        if (el.stExt) el.stExt.textContent = (data.stats.total_links || 400) + '+';
      }

      function renderCategories() {
        let html = `
          <button class="cat-btn ${state.category === 'all' ? 'active' : ''}" data-cat="all">
            <i class="fa-solid fa-border-all"></i> 全部成果
            <span class="cat-count">${data.wishes.length}</span>
          </button>
        `;
        data.categories.forEach(c => {
          html += `
            <button class="cat-btn ${state.category === c.id ? 'active' : ''}" data-cat="${c.id}">
              <i class="fa-solid ${c.icon}"></i> ${escapeHtml(c.name)}
              <span class="cat-count">${c.count}</span>
            </button>
          `;
        });
        el.catTabs.innerHTML = html;
      }

      function getFilteredList() {
        let list = [...data.wishes];

        if (state.category !== 'all') {
          list = list.filter(w => w.category_id === state.category);
        }

        if (state.mediaType !== 'all') {
          if (state.mediaType === 'year114') {
            list = list.filter(w => {
              const combined = `${w.title || ''} ${w.snippet || ''} ${w.section_title || ''} ${w.category_name || ''}`;
              return combined.includes('114');
            });
          } else if (state.mediaType === 'image') list = list.filter(w => w.media_type === 'image');
          else if (state.mediaType === 'video') list = list.filter(w => w.media_type === 'video' || w.link_type === 'youtube');
          else if (state.mediaType === 'audio') list = list.filter(w => w.media_type === 'audio' || w.link_type === 'spotify');
          else if (state.mediaType === 'canva') list = list.filter(w => w.link_type === 'canva' || (w.attachment_url && w.attachment_url.includes('canva')));
          else if (state.mediaType === 'pdf') list = list.filter(w => w.media_type === 'pdf' || w.link_type === 'pdf' || (w.local_media && w.local_media.endsWith('.pdf')));
          else if (state.mediaType === 'form') list = list.filter(w => w.link_type === 'form');
        }

        if (state.search.trim()) {
          const query = state.search.toLowerCase().trim();
          const tokens = query.split(/\s+/).filter(Boolean);
          const subTokens = query.match(/114|113|112|115|閱讀|推動|深耕|mssr|說書|書展|主題|客語|美感|生命|自主/gi) || [];
          const effectiveTokens = tokens.length > 1 ? tokens : (subTokens.length > 1 ? subTokens : [query]);

          list = list.filter(w => {
            const fullText = (
              (w.title || '') + ' ' +
              (w.snippet || '') + ' ' +
              (w.section_title || '') + ' ' +
              (w.category_name || '') + ' ' +
              (w.body_text || '')
            ).toLowerCase();

            if (fullText.includes(query)) return true;
            return effectiveTokens.every(tok => fullText.includes(tok.toLowerCase()));
          });
        }

        if (state.sortBy === 'newest') {
          list.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
        } else if (state.sortBy === 'oldest') {
          list.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
        } else if (state.sortBy === 'media') {
          list.sort((a, b) => (b.local_media ? 1 : 0) - (a.local_media ? 1 : 0));
        }

        return list;
      }

      function renderCards() {
        const filtered = getFilteredList();
        const total = filtered.length;

        if (el.resultsCount) {
          el.resultsCount.textContent = `共篩選出 ${total} 筆成果紀錄`;
        }

        if (total === 0) {
          el.cardsGrid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
              <i class="fa-solid fa-folder-open" style="font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.4;"></i>
              <h3>找不到符合條件的成果</h3>
              <p style="font-size: 0.85rem; margin-top: 4px;">請更換搜尋關鍵字或選擇其他分類</p>
            </div>
          `;
          el.pagination.innerHTML = '';
          return;
        }

        const totalPages = Math.ceil(total / state.perPage);
        if (state.page > totalPages) state.page = 1;

        const start = (state.page - 1) * state.perPage;
        const end = Math.min(start + state.perPage, total);
        const paged = filtered.slice(start, end);

        let html = '';
        paged.forEach(w => {
          const cat = data.categories.find(c => c.id === w.category_id) || { color: '#1b4931', name: '成果' };

          let thumbHtml = '';
          let typeIcon = '';

          if (w.media_type === 'image' && w.local_media) {
            typeIcon = '<span class="card-type-icon" title="成果照片"><i class="fa-solid fa-camera"></i></span>';
            thumbHtml = `
              <div class="card-thumb">
                <img src="${w.local_media}" alt="${escapeHtml(w.title)}" loading="lazy" onerror="this.onerror=null; this.src='assets/official/1660015942_634882_53.jpg';">
                <span class="card-tag" style="background:${cat.color};">${escapeHtml(w.category_name)}</span>
                ${typeIcon}
              </div>
            `;
          } else if (w.media_type === 'video' || w.link_type === 'youtube') {
            typeIcon = '<span class="card-type-icon" title="影音播放"><i class="fa-solid fa-play"></i></span>';
            thumbHtml = `
              <div class="card-thumb" style="background:linear-gradient(135deg, #1e293b, #0f172a);">
                <div class="card-thumb-hero"><i class="fa-solid fa-circle-play" style="font-size:2.5rem; color:#ef4444;"></i><span style="font-size:0.8rem; font-weight:700;">影音紀錄</span></div>
                <span class="card-tag" style="background:${cat.color};">${escapeHtml(w.category_name)}</span>
                ${typeIcon}
              </div>
            `;
          } else if (w.media_type === 'audio' || w.link_type === 'spotify') {
            typeIcon = '<span class="card-type-icon" title="說書錄音"><i class="fa-solid fa-headphones"></i></span>';
            thumbHtml = `
              <div class="card-thumb" style="background:linear-gradient(135deg, #064e3b, #047857);">
                <div class="card-thumb-hero"><i class="fa-solid fa-headphones-simple" style="font-size:2.5rem; color:#34d399;"></i><span style="font-size:0.8rem; font-weight:700;">早修廣播與說書錄音</span></div>
                <span class="card-tag" style="background:${cat.color};">${escapeHtml(w.category_name)}</span>
                ${typeIcon}
              </div>
            `;
          } else if (w.link_type === 'canva') {
            typeIcon = '<span class="card-type-icon" title="Canva教材"><i class="fa-solid fa-palette"></i></span>';
            thumbHtml = `
              <div class="card-thumb" style="background:linear-gradient(135deg, #0369a1, #0284c7);">
                <div class="card-thumb-hero"><i class="fa-solid fa-shapes" style="font-size:2.5rem; color:#7dd3fc;"></i><span style="font-size:0.8rem; font-weight:700;">Canva 數位教材</span></div>
                <span class="card-tag" style="background:${cat.color};">${escapeHtml(w.category_name)}</span>
                ${typeIcon}
              </div>
            `;
          } else {
            typeIcon = '<span class="card-type-icon" title="推動成果"><i class="fa-solid fa-book-open"></i></span>';
            thumbHtml = `
              <div class="card-thumb" style="background:linear-gradient(135deg, var(--bg-subtle), var(--border-color));">
                <div class="card-thumb-hero" style="color:var(--text-secondary);"><i class="fa-solid fa-book-open" style="font-size:2.5rem; color:var(--primary);"></i><span style="font-size:0.8rem; font-weight:700;">${escapeHtml(w.category_name)}</span></div>
                <span class="card-tag" style="background:${cat.color};">${escapeHtml(w.category_name)}</span>
                ${typeIcon}
              </div>
            `;
          }

          html += `
            <div class="card" onclick="window.openDetail('${w.id}')" role="button" tabindex="0">
              ${thumbHtml}
              <div class="card-body">
                <div class="card-sec"><i class="fa-solid fa-bookmark"></i> ${escapeHtml(w.section_title)}</div>
                <h3 class="card-title">${escapeHtml(w.title)}</h3>
                <p class="card-desc">${escapeHtml(w.snippet)}</p>
                <div class="card-footer">
                  <span>${formatDate(w.created_at)}</span>
                  <span class="card-action">查看詳情 <i class="fa-solid fa-chevron-right"></i></span>
                </div>
              </div>
            </div>
          `;
        });

        el.cardsGrid.innerHTML = html;
        renderPagination(totalPages);
      }

      function renderPagination(totalPages) {
        if (totalPages <= 1) {
          el.pagination.innerHTML = '';
          return;
        }

        let html = `
          <button class="page-btn" ${state.page === 1 ? 'disabled' : ''} onclick="window.setPage(${state.page - 1})">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
        `;

        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || (i >= state.page - 2 && i <= state.page + 2)) {
            html += `<button class="page-btn ${state.page === i ? 'active' : ''}" onclick="window.setPage(${i})">${i}</button>`;
          } else if (i === state.page - 3 || i === state.page + 3) {
            html += `<span style="padding: 0 4px; color: var(--text-muted);">...</span>`;
          }
        }

        html += `
          <button class="page-btn" ${state.page === totalPages ? 'disabled' : ''} onclick="window.setPage(${state.page + 1})">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        `;

        el.pagination.innerHTML = html;
      }

      window.setPage = function (p) {
        state.page = p;
        renderCards();
        window.scrollTo({ top: 120, behavior: 'smooth' });
      };

      window.openDetail = function (id) {
        const wish = data.wishes.find(w => w.id === id);
        if (!wish) return;

        const cat = data.categories.find(c => c.id === wish.category_id) || { color: '#1b4931' };

        let mediaHtml = '';
        if (wish.youtube_id) {
          mediaHtml = `<iframe src="https://www.youtube.com/embed/${wish.youtube_id}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media" allowfullscreen></iframe>`;
        } else if (wish.media_type === 'video' && wish.local_media) {
          mediaHtml = `<video controls autoplay><source src="${wish.local_media}" type="video/mp4"></video>`;
        } else if (wish.media_type === 'audio' && wish.local_media) {
          mediaHtml = `
            <div style="width:100%; padding:2rem 1rem; background:linear-gradient(135deg, #064e3b, #047857); text-align:center; color:#fff;">
              <i class="fa-solid fa-headphones-simple" style="font-size:3rem; color:#34d399; margin-bottom:0.8rem;"></i>
              <audio controls autoplay style="width:100%; max-width:460px;"><source src="${wish.local_media}" type="audio/mpeg"></audio>
            </div>
          `;
        } else if (wish.media_type === 'pdf' || (wish.local_media && wish.local_media.endsWith('.pdf'))) {
          const pdfPath = wish.local_media || wish.attachment_url;
          mediaHtml = `
            <div style="width:100%; padding:2rem 1rem; background:linear-gradient(135deg, #831843, #be185d); text-align:center; color:#fff; border-radius:8px;">
              <i class="fa-solid fa-file-pdf" style="font-size:3rem; color:#fbcfe8; margin-bottom:0.8rem;"></i>
              <h4 style="font-size:1.1rem; font-weight:700; margin-bottom:0.5rem;">${escapeHtml(wish.title)}</h4>
              <p style="font-size:0.85rem; opacity:0.9; margin-bottom:1rem;">📄 官方 PDF 成果文件，可直接開啟或下載：</p>
              <div style="display:flex; justify-content:center; gap:0.5rem; flex-wrap:wrap;">
                <a href="${pdfPath}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="background:#fff; color:#be185d; border-color:#fff;">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i> 開啟 PDF
                </a>
                <a href="${pdfPath}" download class="btn btn-secondary" style="border-color:rgba(255,255,255,0.6); color:#fff;">
                  <i class="fa-solid fa-download"></i> 下載 PDF
                </a>
              </div>
            </div>
          `;
        } else if (wish.link_type === 'canva' || (wish.attachment_url && wish.attachment_url.includes('canva'))) {
          mediaHtml = `
            <div style="width:100%; padding:2rem 1rem; background:linear-gradient(135deg, #0369a1, #0284c7); text-align:center; color:#fff; border-radius:8px;">
              <i class="fa-solid fa-palette" style="font-size:3rem; color:#7dd3fc; margin-bottom:0.8rem;"></i>
              <h4 style="font-size:1.1rem; font-weight:700; margin-bottom:0.5rem;">${escapeHtml(wish.title)}</h4>
              <p style="font-size:0.85rem; opacity:0.9; margin-bottom:1rem;">🎨 Canva 數位互動簡報，請於新視窗開啟：</p>
              <a href="${wish.attachment_url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="background:#fff; color:#0284c7; border-color:#fff;">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> 開啟 Canva 官方網頁
              </a>
            </div>
          `;
        } else if (wish.media_type === 'image' && wish.local_media) {
          mediaHtml = `<img src="${wish.local_media}" alt="${escapeHtml(wish.title)}" onerror="this.onerror=null; this.src='assets/official/1660015942_634882_53.jpg';">`;
        }

        el.modalMedia.innerHTML = mediaHtml;
        el.modalMedia.style.display = mediaHtml ? 'flex' : 'none';

        el.modalMeta.innerHTML = `
          <span style="background:${cat.color}; color:#fff; padding:2px 8px; border-radius:12px; font-weight:700;">${escapeHtml(wish.category_name)}</span>
          <span><i class="fa-solid fa-folder"></i> ${escapeHtml(wish.section_title)}</span>
          <span><i class="fa-regular fa-clock"></i> ${formatDate(wish.created_at)}</span>
        `;

        el.modalTitle.textContent = wish.title;

        let content = wish.body_html || '';
        if (!content && wish.snippet) content = `<p>${escapeHtml(wish.snippet)}</p>`;
        el.modalContent.innerHTML = content || '<p style="color:var(--text-muted);">本成果以多媒體或線上教材呈現。</p>';

        let actions = '';
        if (wish.attachment_url) {
          let btnLabel = '開啟外部數位教材';
          let btnIcon = 'fa-arrow-up-right-from-square';
          if (wish.link_type === 'canva') { btnLabel = '開啟 Canva 數位簡報'; btnIcon = 'fa-palette'; }
          else if (wish.link_type === 'spotify') { btnLabel = '前往 Spotify 收聽'; btnIcon = 'fa-spotify'; }
          else if (wish.link_type === 'youtube') { btnLabel = 'YouTube 觀看'; btnIcon = 'fa-youtube'; }
          else if (wish.link_type === 'form') { btnLabel = '填寫學習單 / 問卷'; btnIcon = 'fa-clipboard-question'; }

          actions += `
            <a href="${wish.attachment_url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
              <i class="fa-solid ${btnIcon}"></i> ${btnLabel}
            </a>
          `;
        }

        el.modalActions.innerHTML = actions;
        el.modalBackdrop.classList.add('active');
        document.body.style.overflow = 'hidden';
      };

      function closeModal() {
        el.modalBackdrop.classList.remove('active');
        el.modalMedia.innerHTML = '';
        document.body.style.overflow = '';
      }

      function bindEvents() {
        if (el.catTabs) {
          el.catTabs.addEventListener('click', e => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;
            el.catTabs.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            state.category = btn.getAttribute('data-cat');
            state.page = 1;
            renderCards();
          });
        }

        if (el.mediaChips) {
          el.mediaChips.addEventListener('click', e => {
            const chip = e.target.closest('.media-chip');
            if (!chip) return;
            el.mediaChips.querySelectorAll('.media-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            state.mediaType = chip.getAttribute('data-type');
            state.page = 1;
            renderCards();
          });
        }

        if (el.searchInput) {
          let timer;
          el.searchInput.addEventListener('input', e => {
            clearTimeout(timer);
            const val = e.target.value;
            if (el.searchClear) el.searchClear.style.display = val ? 'block' : 'none';
            timer = setTimeout(() => {
              state.search = val;
              state.page = 1;
              renderCards();
            }, 180);
          });
        }

        if (el.searchClear) {
          el.searchClear.addEventListener('click', () => {
            el.searchInput.value = '';
            el.searchClear.style.display = 'none';
            state.search = '';
            state.page = 1;
            renderCards();
            el.searchInput.focus();
          });
        }

        if (el.sortSelect) {
          el.sortSelect.addEventListener('change', e => {
            state.sortBy = e.target.value;
            state.page = 1;
            renderCards();
          });
        }

        if (el.themeBtn) {
          el.themeBtn.addEventListener('click', () => {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            applyTheme(state.theme);
          });
        }

        if (el.modalClose) el.modalClose.addEventListener('click', closeModal);
        if (el.modalBackdrop) {
          el.modalBackdrop.addEventListener('click', e => {
            if (e.target === el.modalBackdrop) closeModal();
          });
        }

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') closeModal();
        });

        window.addEventListener('scroll', () => {
          if (el.fabTop) {
            if (window.scrollY > 250) el.fabTop.classList.add('visible');
            else el.fabTop.classList.remove('visible');
          }
        }, { passive: true });

        if (el.fabTop) {
          el.fabTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatDate(iso) {
        if (!iso) return '';
        try {
          const d = new Date(iso);
          return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        } catch {
          return '';
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
